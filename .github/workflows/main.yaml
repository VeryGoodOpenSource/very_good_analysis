name: very_good_analysis

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.8.2
        with:
          sdk: "3.14.0"

      - name: Install Dependencies
        run: dart pub get

      - name: Format
        run: dart format --set-exit-if-changed lib example

      - name: Analyze
        run: dart analyze lib example

  pana:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/pana.yml@v2
